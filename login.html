<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <form>
    <fieldset>
      <legend>Login</legend>
      <label for="nickname_email">NickName/E-mail:</label>
      <input type="text" id="nickname_email" name="nickname/email" placeholder="Digite seu NickName/E-mail">  
    </fieldset>
      
    <fieldset>
      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" placeholder="Digite sua senha">  
    </fieldset>

    <input type="submit" value="Login">
    <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
  </form>
</body>
</html>
