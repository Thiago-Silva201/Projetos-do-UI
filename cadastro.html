<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <form>
    <fieldset>
      <legend>Cadastro</legend>
      <label for="nome_completo">Nome Completo:</label>
      <input type="text" id="nome_completo" name="nome_completo" placeholder="Digite seu Nome Completo">  
    </fieldset>
      
    <fieldset>
      <label for="nickname">NickName:</label>
      <input type="text" id="nickname" name="nickname" placeholder="Digite seu NickName">  
    </fieldset>

    <fieldset>
      <label for="dt_nascimento">Data de Nascimento:</label>
      <input type="date" id="dt_nascimento" name="dt_nascimento">
    </fieldset>

    <fieldset>
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" placeholder="Digite Seu E-mail"> 
    </fieldset>

    <fieldset>
      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" placeholder="Crie uma senha">  
    </fieldset>

    <fieldset>
      <label>Gênero:</label>
      <input type="radio" id="masculino" name="genero" value="M">
      <label for="masculino">Masculino</label>

      <input type="radio" id="feminino" name="genero" value="F">
      <label for="feminino">Feminino</label>
    </fieldset>

    <input type="submit" value="Cadastrar">
    <p>Já tem uma conta? <a href="login.html">Faça Login</a></p>
  </form>
</body>
</html>
