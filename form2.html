
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        form {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 25px;
        }

        fieldset {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        legend {
            color: #243b55;
            font-weight: bold;
            padding: 0 10px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            color: #333;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #243b55;
            box-shadow: 0 0 5px rgba(36,59,85,0.3);
        }

        .opcao {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0;
        }

        .opcao label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        input[type="radio"],
        input[type="checkbox"] {
            accent-color: #243b55;
            width: 17px;
            height: 17px;
            cursor: pointer;
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background: #141e30;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            form {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <form>
        <h1>Formulário</h1>

        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome_completo">Nome Completo:</label>
            <input type="text" id="nome_completo"
                name="nome_completo"
                placeholder="Digite seu nome completo">

            <label for="dt_nascimento">Data de Nascimento:</label>
            <input type="date" id="dt_nascimento"
                name="dt_nascimento">

            <label for="email">E-mail:</label>
            <input type="email" id="email"
                name="email"
                placeholder="Digite seu e-mail">

            <label for="uf">Unidade Federativa:</label>
            <select name="uf" id="uf">
                <option value="">Selecione uma UF</option>
                <option value="ac">AC</option>
                <option value="al">AL</option>
                <option value="ap">AP</option>
                <option value="am">AM</option>
                <option value="ba">BA</option>
                <option value="ce">CE</option>
                <option value="df">DF</option>
                <option value="es">ES</option>
                <option value="go">GO</option>
                <option value="ma">MA</option>
                <option value="mt">MT</option>
                <option value="ms">MS</option>
                <option value="mg">MG</option>
                <option value="pa">PA</option>
                <option value="pb">PB</option>
                <option value="pr">PR</option>
                <option value="pe">PE</option>
                <option value="pi">PI</option>
                <option value="rj">RJ</option>
                <option value="rn">RN</option>
                <option value="rs">RS</option>
                <option value="ro">RO</option>
                <option value="rr">RR</option>
                <option value="sc">SC</option>
                <option value="sp">SP</option>
                <option value="se">SE</option>
                <option value="to">TO</option>
            </select>

            <label for="senha">Senha:</label>
            <input type="password" id="senha"
                name="senha"
                placeholder="Digite sua senha">
        </fieldset>

        <fieldset>
            <legend>Gênero</legend>

            <div class="opcao">
                <input type="radio" id="masculino"
                    name="genero" value="M">
                <label for="masculino">Masculino</label>
            </div>

            <div class="opcao">
                <input type="radio" id="feminino"
                    name="genero" value="F">
                <label for="feminino">Feminino</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Cursos</legend>

            <div class="opcao">
                <input type="checkbox" id="ti"
                    name="cursos" value="TI">
                <label for="ti">TI</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="mecanica_a"
                    name="cursos" value="mecanica_a">
                <label for="mecanica_a">Mecânica aeronáutica</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="programacao"
                    name="cursos" value="programacao">
                <label for="programacao">Programação</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="informatica"
                    name="cursos" value="informatica">
                <label for="informatica">Informática</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="eletronica"
                    name="cursos" value="eletronica">
                <label for="eletronica">Eletrônica</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="redes"
                    name="cursos" value="redes">
                <label for="redes">Redes de Computadores</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="administracao"
                    name="cursos" value="administracao">
                <label for="administracao">Administração</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="mecanica_i"
                    name="cursos" value="mecanica_i">
                <label for="mecanica_i">Mecânica Industrial</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="aeronautica"
                    name="cursos" value="aeronautica">
                <label for="aeronautica">Manutenção de Aeronaves</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="seguranca"
                    name="cursos" value="seguranca">
                <label for="seguranca">Segurança do Trabalho</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="logistica"
                    name="cursos" value="logistica">
                <label for="logistica">Logística</label>
            </div>

        </fieldset>

        <input type="submit" value="Enviar">

    </form>

</body>
</html>
